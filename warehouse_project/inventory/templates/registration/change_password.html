{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="card mx-auto mt-5" style="max-width: 450px;">
    <div class="card-header bg-danger text-white text-center">
        <h4 class="mb-0">{% trans "Зміна пароля" %}</h4>
    </div>
    <div class="card-body">
        <p class="text-muted small text-center">
            {% trans "Будь ласка, введіть старий пароль для підтвердження особи." %}
        </p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-danger">
                    {% trans "Оновити пароль" %}
                </button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
                    {% trans "Назад до профілю" %}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
